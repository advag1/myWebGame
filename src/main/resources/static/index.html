<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- 1. פאנל בחירת פרופיל שחקן -->
        <div id="profile-select-panel" class="panel" style="text-align: center; margin-top: 40px;">
            <h2>Choose Your Hero Profile</h2>
            <div class="buttons-grid profile-grid" style="grid-template-columns: 1fr 1fr 1fr; margin-top: 20px;">
                
                <!-- Standard -->
                <button class="profile-card" onclick="selectProfile('standard')">
                    <svg viewBox="0 0 120 120" class="profile-preview-svg">
                        <path d="M35 55 L20 105 L55 100 Z" fill="#1e40af"/>
                        <rect x="44" y="85" width="10" height="22" rx="3" fill="#334155"/>
                        <rect x="62" y="85" width="10" height="22" rx="3" fill="#334155"/>
                        <rect x="40" y="50" width="36" height="38" rx="8" fill="#64748b" stroke="#1e293b" stroke-width="3"/>
                        <path d="M48 55 L68 55 L64 78 L52 78 Z" fill="#94a3b8"/>
                        <circle cx="58" cy="34" r="18" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
                        <rect x="52" y="28" width="22" height="8" rx="3" fill="#0f172a"/>
                        <path d="M48 16 Q32 8 36 24 Q44 22 52 18 Z" fill="#ef4444"/>
                        <path d="M30 56 L48 56 L48 76 Q39 86 30 76 Z" fill="#2563eb" stroke="#1e293b" stroke-width="2.5"/>
                        <rect x="78" y="64" width="14" height="5" rx="2" fill="#eab308"/>
                        <polygon points="92,62 116,66.5 92,71" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
                    </svg>
                    <strong>Standard</strong>
                    <span dir="ltr">100 HP | ATK: 10 | Def: 5</span>
                </button>

                <!-- Guardian -->
                <button class="profile-card" onclick="selectProfile('guardian')">
                    <svg viewBox="0 0 120 120" class="profile-preview-svg">
                        <rect x="38" y="84" width="15" height="24" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
                        <rect x="63" y="84" width="15" height="24" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
                        <rect x="32" y="46" width="52" height="42" rx="10" fill="#d97706" stroke="#451a03" stroke-width="3"/>
                        <circle cx="34" cy="52" r="11" fill="#f59e0b" stroke="#451a03" stroke-width="2.5"/>
                        <circle cx="82" cy="52" r="11" fill="#f59e0b" stroke="#451a03" stroke-width="2.5"/>
                        <rect x="40" y="16" width="36" height="32" rx="8" fill="#fbbf24" stroke="#451a03" stroke-width="3"/>
                        <path d="M46 28 H70 V34 H61 V42 H55 V34 H46 Z" fill="#1e293b"/>
                        <path d="M58 16 Q42 2 38 14 Q48 16 58 16 Z" fill="#dc2626"/>
                        <rect x="86" y="44" width="10" height="28" rx="3" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
                        <circle cx="91" cy="40" r="8" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
                        <path d="M22 44 H54 V84 Q38 100 22 84 Z" fill="#1d4ed8" stroke="#fbbf24" stroke-width="3.5"/>
                        <path d="M38 52 V82 M28 65 H48" stroke="#fbbf24" stroke-width="3"/>
                    </svg>
                    <strong>Guardian</strong>
                    <span dir="ltr">130 HP | ATK: 8 | Def: 7</span>
                </button>

                <!-- Striker -->
                <button class="profile-card" onclick="selectProfile('striker')">
                    <svg viewBox="0 0 120 120" class="profile-preview-svg">
                        <path d="M46 42 L16 52 L24 62 L48 50 Z" fill="#dc2626"/>
                        <path d="M44 84 L38 106 L48 106 L54 84 Z" fill="#1e293b"/>
                        <path d="M62 84 L68 106 L78 106 L72 84 Z" fill="#1e293b"/>
                        <path d="M44 50 L72 50 L68 86 L48 86 Z" fill="#15803d" stroke="#052e16" stroke-width="2.5"/>
                        <rect x="46" y="72" width="24" height="6" fill="#78350f"/>
                        <path d="M38 42 Q58 10 78 42 L72 50 L44 50 Z" fill="#166534" stroke="#052e16" stroke-width="2.5"/>
                        <circle cx="58" cy="36" r="13" fill="#fde68a"/>
                        <path d="M46 36 Q58 46 70 36 L68 46 Q58 50 48 46 Z" fill="#0f172a"/>
                        <rect x="51" y="31" width="5" height="3" rx="1" fill="#ef4444"/>
                        <rect x="61" y="31" width="5" height="3" rx="1" fill="#ef4444"/>
                        <polygon points="74,60 104,54 74,66" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
                        <polygon points="72,72 98,74 72,78" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
                    </svg>
                    <strong>Striker</strong>
                    <span dir="ltr">80 HP | ATK: 12 | Def: 5</span>
                </button>

            </div>
        </div>

        <!-- 2. תוכן המשחק -->
        <div id="game-container" class="hidden">
            <header>
                <h1>Battle Adventure - My Web Game</h1>
                <div class="header-controls">
                    <span id="encounter-badge" class="badge">stage 1 of 2</span>
                    <button class="header-restart-btn" onclick="resetGame()">new game ↻</button>
                </div>
            </header>

            <div class="battle-stage" dir="ltr">
                <div class="stage-ground"></div>

                <div class="fighter-box" id="player-box">
                    <div class="hud-card">
                        <div class="hud-title">
                            <strong id="player-name-text">Player (you)</strong>
                            <span>⚔️ <b id="player-atk-text">10</b></span>
                        </div>
                        <div class="bar-label">HP: <span id="player-hp-text">100/100</span></div>
                        <div class="bar-bg"><div id="player-hp-bar" class="bar-fill hp-fill"></div></div>
                        <div class="bar-label">Resource: <span id="player-res-text">5/10</span></div>
                        <div class="bar-bg"><div id="player-res-bar" class="bar-fill res-fill"></div></div>
                    </div>

                    <div class="sprite-wrapper" id="player-sprite">
                        <div id="player-shield" class="shield-aura hidden"></div>

                        <!-- דמות 1: Standard (אביר) -->
                        <svg id="svg-player-standard" viewBox="0 0 120 120" class="character-svg idle-anim">
                            <path d="M35 55 L20 105 L55 100 Z" fill="#1e40af"/>
                            <rect x="44" y="85" width="10" height="22" rx="3" fill="#334155"/>
                            <rect x="62" y="85" width="10" height="22" rx="3" fill="#334155"/>
                            <rect x="40" y="50" width="36" height="38" rx="8" fill="#64748b" stroke="#1e293b" stroke-width="3"/>
                            <path d="M48 55 L68 55 L64 78 L52 78 Z" fill="#94a3b8"/>
                            <circle cx="58" cy="34" r="18" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
                            <rect x="52" y="28" width="22" height="8" rx="3" fill="#0f172a"/>
                            <path d="M48 16 Q32 8 36 24 Q44 22 52 18 Z" fill="#ef4444"/>
                            <path d="M30 56 L48 56 L48 76 Q39 86 30 76 Z" fill="#2563eb" stroke="#1e293b" stroke-width="2.5"/>
                            <g id="player-sword">
                                <rect x="78" y="64" width="14" height="5" rx="2" fill="#eab308"/>
                                <polygon points="92,62 116,66.5 92,71" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
                            </g>
                        </svg>

                        <!-- דמות 2: Guardian (שומר משוריין כבד) -->
                        <svg id="svg-player-guardian" viewBox="0 0 120 120" class="character-svg idle-anim hidden">
                            <rect x="38" y="84" width="15" height="24" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
                            <rect x="63" y="84" width="15" height="24" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2.5"/>
                            <rect x="32" y="46" width="52" height="42" rx="10" fill="#d97706" stroke="#451a03" stroke-width="3"/>
                            <circle cx="34" cy="52" r="11" fill="#f59e0b" stroke="#451a03" stroke-width="2.5"/>
                            <circle cx="82" cy="52" r="11" fill="#f59e0b" stroke="#451a03" stroke-width="2.5"/>
                            <rect x="40" y="16" width="36" height="32" rx="8" fill="#fbbf24" stroke="#451a03" stroke-width="3"/>
                            <path d="M46 28 H70 V34 H61 V42 H55 V34 H46 Z" fill="#1e293b"/>
                            <path d="M58 16 Q42 2 38 14 Q48 16 58 16 Z" fill="#dc2626"/>
                            <rect x="86" y="44" width="10" height="28" rx="3" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
                            <circle cx="91" cy="40" r="8" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
                            <path d="M22 44 H54 V84 Q38 100 22 84 Z" fill="#1d4ed8" stroke="#fbbf24" stroke-width="3.5"/>
                            <path d="M38 52 V82 M28 65 H48" stroke="#fbbf24" stroke-width="3"/>
                        </svg>

                        <!-- דמות 3: Striker (מתנקש/סייר זריז) -->
                        <svg id="svg-player-striker" viewBox="0 0 120 120" class="character-svg idle-anim hidden">
                            <path d="M46 42 L16 52 L24 62 L48 50 Z" fill="#dc2626"/>
                            <path d="M44 84 L38 106 L48 106 L54 84 Z" fill="#1e293b"/>
                            <path d="M62 84 L68 106 L78 106 L72 84 Z" fill="#1e293b"/>
                            <path d="M44 50 L72 50 L68 86 L48 86 Z" fill="#15803d" stroke="#052e16" stroke-width="2.5"/>
                            <rect x="46" y="72" width="24" height="6" fill="#78350f"/>
                            <path d="M38 42 Q58 10 78 42 L72 50 L44 50 Z" fill="#166534" stroke="#052e16" stroke-width="2.5"/>
                            <circle cx="58" cy="36" r="13" fill="#fde68a"/>
                            <path d="M46 36 Q58 46 70 36 L68 46 Q58 50 48 46 Z" fill="#0f172a"/>
                            <rect x="51" y="31" width="5" height="3" rx="1" fill="#ef4444"/>
                            <rect x="61" y="31" width="5" height="3" rx="1" fill="#ef4444"/>
                            <polygon points="74,60 104,54 74,66" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
                            <polygon points="72,72 98,74 72,78" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
                        </svg>

                        <div class="floor-shadow"></div>
                    </div>
                </div>

                <div class="fx-layer">
                    <div id="slash-fx" class="slash-fx hidden"></div>
                    <div id="fireball-fx" class="fireball-fx hidden"></div>
                </div>

                <div class="fighter-box" id="enemy-box">
                    <div class="hud-card">
                        <div class="hud-title">
                            <strong id="enemy-name">enemy1</strong>
                            <span id="enemy-rank">שלב 1</span>
                        </div>
                        <div class="bar-label">HP: <span id="enemy-hp-text">30/30</span></div>
                        <div class="bar-bg"><div id="enemy-hp-bar" class="bar-fill enemy-fill"></div></div>
                    </div>

                    <div class="sprite-wrapper" id="enemy-sprite">
                        <svg id="svg-enemy1" viewBox="0 0 120 120" class="character-svg idle-anim">
                            <rect x="44" y="84" width="11" height="22" rx="4" fill="#15803d"/>
                            <rect x="64" y="84" width="11" height="22" rx="4" fill="#15803d"/>
                            <ellipse cx="60" cy="64" rx="24" ry="26" fill="#22c55e" stroke="#14532d" stroke-width="3"/>
                            <polygon points="42,42 34,24 50,38" fill="#fef08a" stroke="#713f12" stroke-width="2"/>
                            <polygon points="78,42 86,24 70,38" fill="#fef08a" stroke="#713f12" stroke-width="2"/>
                            <circle cx="50" cy="54" r="4" fill="#dc2626"/>
                            <circle cx="66" cy="54" r="4" fill="#dc2626"/>
                            <path d="M46 68 Q58 62 70 68" stroke="#14532d" stroke-width="3" fill="none"/>
                            <polygon points="36,68 12,48 18,42 40,62" fill="#92400e" stroke="#451a03" stroke-width="2"/>
                        </svg>

                        <svg id="svg-enemy2" viewBox="0 0 120 120" class="character-svg idle-anim hidden">
                            <path d="M82 48 L104 104 L65 100 Z" fill="#7f1d1d"/>
                            <rect x="44" y="84" width="12" height="24" rx="3" fill="#1f2937"/>
                            <rect x="64" y="84" width="12" height="24" rx="3" fill="#1f2937"/>
                            <rect x="38" y="46" width="44" height="42" rx="8" fill="#991b1b" stroke="#450a0a" stroke-width="3"/>
                            <circle cx="60" cy="30" r="19" fill="#374151" stroke="#111827" stroke-width="3"/>
                            <path d="M42 22 Q24 6 28 28" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
                            <path d="M78 22 Q96 6 92 28" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
                            <rect x="46" y="26" width="9" height="5" rx="2" fill="#facc15"/>
                            <rect x="61" y="26" width="9" height="5" rx="2" fill="#facc15"/>
                            <polygon points="36,64 6,54 10,46 38,58" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
                        </svg>

                        <div class="floor-shadow"></div>
                    </div>
                </div>
            </div>

            <div id="actions-panel" class="panel">
                <h3>choose an action:</h3>
                <div class="buttons-grid">
                    <button id="btn-attack" onclick="sendAction('attack')">
                        <strong>Attack</strong>
                        <span>base attack: attacking enemy, take 10 damage from enemy</span>
                    </button>
                    <button id="btn-special" onclick="sendAction('special')">
                        <strong>Special (attack)</strong>
                        <span>cost: 3 resources | deal 15 damage to enemy</span>
                    </button>
                    <button id="btn-recover" onclick="sendAction('recover')">
                        <strong>Recover</strong>
                        <span>add 3 resources</span>
                    </button>
                    <button id="btn-defend" onclick="sendAction('defend')">
                        <strong>Defend</strong>
                        <span>block incoming damage using shield</span>
                    </button>
                </div>
            </div>

            <div id="reward-panel" class="panel hidden">
                <h3>you won the first stage! choose a reward to continue:</h3>
                <div class="buttons-grid">
                    <button onclick="sendAction('reward1')">
                        <strong>RECOVERY</strong>
                        <span>add 25 HP</span>
                    </button>
                    <button onclick="sendAction('reward2')">
                        <strong>POWER</strong>
                        <span>increase attack power by 2</span>
                    </button>
                </div>
            </div>

            <div id="gameover-panel" class="panel hidden">
                <h3 id="gameover-message"></h3>
                <button class="restart-btn" onclick="resetGame()">new game</button>
            </div>

            <div class="panel">
                <h3>Battle Log</h3>
                <pre id="battle-log" class="log-box"></pre>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
